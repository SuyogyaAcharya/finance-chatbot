
services:
  # PostgreSQL Database
  postgres:
    image: postgres:13-alpine
    container_name: finance-postgres
    environment:
      POSTGRES_DB: financedb
      POSTGRES_USER: financeuser
      POSTGRES_PASSWORD: financepass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financeuser -d financedb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Chat Service
  chat-service:
    build: ./chat-service
    container_name: finance-chat
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - FINANCE_SERVICE_URL=http://finance-service:3002
    volumes:
      - ./chat-service:/app
      - /app/node_modules
    depends_on:
      - finance-service

  # Finance Service
  finance-service:
    build: ./finance-service
    container_name: finance-finance
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=financedb
      - DB_USER=financeuser
      - DB_PASSWORD=financepass
    volumes:
      - ./finance-service:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: finance-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - chat-service
      - finance-service

volumes:
  postgres-data: